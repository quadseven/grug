name: Guard · Private leaks

# PURPOSE: this repo is PUBLIC. Stop private-infrastructure identifiers -
#   hostnames, cluster/node names, private-range IPs, cross-repo issue refs,
#   and the names of people and products - from reaching it.
#
# THIS IS NOW A THIN CALLER for the fleet's shared leak scan,
#   quadseven/infra-public/.github/workflows/_reusable.leak-scan.yml, the same
#   one every other first-party public repo runs (infra#2997). This repo's
#   copy of the scanner was the origin of the shared one; running two copies
#   in CI meant a pattern fix landed in one and not the other. The local
#   scripts/check_private_leaks.py stays for the pre-commit hook
#   (.githooks/pre-commit), which runs before a commit exists and needs no
#   network.
#
# WHAT IT SCANS. The PR diff AND the PR title/body. Most of the 2026-08-15
#   leaks were in prose, not code.
#
# LAYER 2 IS ON (grug#921). Shapes cannot match a PERSON: a first name has no
#   shape. The specific terms live in the SSM SecureString below and are
#   fetched at run time through grug-gha-leak-guard, a role whose ENTIRE
#   policy is "read that one parameter" (infra/pulumi/components/
#   leak_guard_role.py). Deliberately NOT grug-gha-deploy: trusting that from
#   a pull_request would hand deploy rights to anyone who can open a PR.
#   scripts/tests/test_check_private_leaks.py asserts this caller still passes
#   the parameter, so dropping it fails a test instead of silently un-arming
#   the guard - which is how this guard ran for months.
#
# FAIL CLOSED. A deny-list that cannot be read, or holds no terms, is a red
#   check. So is a scanner that could not run. A deny-list hit is redacted in
#   the log, never echoed: this log is public.
#
# FORK PRs. A fork PR gets no secrets and cannot mint OIDC, so the role ARN
#   below resolves to empty and the reusable fails with "deny-list-ssm-param is
#   set but the aws-role-arn secret is empty" rather than quietly running layer
#   1 only. A maintainer re-opens such a change from a branch in this repo.
#
# scanner-ref: pinned to the infra-public commit that makes the shared scanner
#   read the deny-list one term per line and redact deny-list hits
#   (infra-public#106). Before that change the shared scanner split the list on
#   whitespace and echoed matched terms, so it must not read this list at main
#   until that merges. Drop this input (back to the default, `main`) once it
#   has.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  leak-scan:
    uses: quadseven/infra-public/.github/workflows/_reusable.leak-scan.yml@c9bd945704f0d33f1fa576eb4a5d469910c483df
    permissions:
      contents: read
      # Mint the OIDC token for grug-gha-leak-guard.
      id-token: write
    with:
      allowed-repo-refs: infra, infra-public
      # Path, not a secret. The VALUES are the secret and live only in this
      # SecureString, never in this repo.
      deny-list-ssm-param: /grug/leak-guard-deny-list
      scanner-ref: f138bba57e6dc6366d5fc171e5d643a4f4c052ac
    secrets:
      # Empty (not a half-built ARN) when AWS_ACCOUNT_ID is unavailable, e.g.
      # on a fork PR, so the reusable's explicit "secret is empty" refusal
      # fires instead of an opaque AssumeRole error.
      aws-role-arn: ${{ secrets.AWS_ACCOUNT_ID && format('arn:aws:iam::{0}:role/grug-gha-leak-guard', secrets.AWS_ACCOUNT_ID) || '' }}
