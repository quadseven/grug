# grugthink test gate: the whole tests/ directory. The pgvector memory backend
# (docs/pgvector-memory.md) runs against a REAL pgvector Postgres, because the
# store's semantics -- ON CONFLICT dedup, cosine `<=>` ordering,
# namespace/server isolation -- are exactly what a fake gets wrong. The service
# image is pgvector/pgvector:pg18 (stock postgres has no `vector` extension).
# Every other test is pure mocks: no network, no Discord, no model calls.
name: check.grugthink

on:
  pull_request:
    paths:
      - 'grugthink/**'
      - '.github/workflows/check.grugthink.yml'
  push:
    branches: [main]
    paths:
      - 'grugthink/**'

permissions:
  contents: read

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: grugthink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GRUGTHINK_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/grugthink_test
    defaults:
      run:
        working-directory: grugthink
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # Includes the pgvector store tests (real Postgres above), the chat reply
      # path (#1045), the trust gates (#1632), the API routers and the config
      # package. A test that skips for want of the database fails the gate
      # below, so the store tests cannot pass by not running.
      # Coverage covers grugthink/src. The floor is the value measured after
      # the bot manager, personality engine, router and middleware tests landed
      # (55.3% without the database tests); raising it is a separate change.
      - name: grugthink tests (whole tests/ directory, coverage floor)
        run: >-
          PYTHONPATH=. python -m pytest tests -v -rs
          --cov=src/grugthink --cov-report=term --cov-report=xml
          --cov-fail-under=55
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grugthink-coverage
          path: grugthink/coverage.xml
          if-no-files-found: ignore
      - name: pgvector store tests must not skip
        run: |
          PYTHONPATH=. python -m pytest tests/test_pgvector_store.py -q -rs | tee pgvector.log
          if grep -q 'SKIPPED' pgvector.log; then echo "pgvector store tests skipped"; exit 1; fi
