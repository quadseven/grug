# Python test gate. Until this workflow, the pytest suites only ran via
# local `make test-*` convention - nothing gated PRs. The postgres
# service backs the real-Postgres store tests (test_pg_stores.py, #354):
# their semantics (ON CONFLICT atomicity, jsonb merge, concurrent
# claims) are exactly what fakes get wrong, so no sqlite stand-in.
name: check.python

on:
  pull_request:
    paths:
      - 'services/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/check.python.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: grug_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Post-#354 swap: the store IS Postgres, so the route/store tests
      # in BOTH suites use the service container (job-level env; the
      # suites carry psycopg now). The dedicated pg-test step keeps the
      # skip-guard lane.
      GRUG_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/grug_test
      # moto-backed suites construct boto3 clients at import; hosted
      # runners have no ambient AWS config (developer shells do, which
      # is why this never bit locally).
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
      # Without this, every opengrep-backed rule test in test_sast_rules.py
      # (and test_sast.py's real-engine test) skips silently in CI - the
      # rules are asserted well-formed but never asserted to MATCH anything,
      # which is the exact "component runs, exits 0, covers nothing" shape
      # #859/#866 exist to fix, one layer up the stack. Pinned to the same
      # OPENGREP_VERSION as services/Dockerfile's opengrep-fetch stage - bump
      # both together. amd64/x86 asset: hosted ubuntu-latest runners are
      # x86_64 (the Dockerfile's arm64 asset is for the arm64 k8s nodes, a
      # different target).
      - name: install opengrep (pinned to match services/Dockerfile)
        run: |
          # #896: a ~100MB fetch over a public CDN is not fast, so
          # --max-time is generous (5 min); --retry covers a transient
          # stall without failing the whole job for it.
          curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 \
            --retry-connrefused -o /usr/local/bin/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/v1.27.1/opengrep_manylinux_x86"
          chmod 0755 /usr/local/bin/opengrep
          opengrep --version
      - name: webhook tests
        run: make webhook-test
      - name: scripts tests (promotion decision + migration)
        run: make scripts-test
      - name: api tests
        run: make api-test
      - name: pg store tests (real Postgres)
        run: make pg-test
