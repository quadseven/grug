# The lane pre-PR check: the suites check.python.yml runs, through the same
# make targets. Without GRUG_TEST_DATABASE_URL and opengrep the store-backed
# and SAST-engine tests skip here; CI runs them against its Postgres service.
interpreter: uv
check: AWS_DEFAULT_REGION=us-east-1 AWS_ACCESS_KEY_ID=testing AWS_SECRET_ACCESS_KEY=testing make test
# check.attesters.yml runs this only for some paths, so `check` leaves it
# out; it is pure stdlib and takes well under a second, so it runs on every
# lane change rather than filtering LOOM_CHANGED_FILES (#1464).
affected: python3 infra/scripts/attest_elder_evaluation_purity.py
