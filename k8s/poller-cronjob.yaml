# Reaction poller (#354): the EventBridge-scheduled Lambda becomes a
# CronJob invoking the SAME handler. Image placeholders rewritten at
# deploy like the Deployments.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grug-poller
  namespace: grug
  labels: {app: grug-poller}
spec:
  # UNSUSPENDED at the cutover: the Lambda poller (and its EventBridge
  # schedule) retired 2026-06-12 - this CronJob is now the ONLY poller,
  # so there is no double-submit risk. (It shipped suspend:true while
  # the Lambda still ran; flipping it was part of the api cutover PR.)
  suspend: false
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      # Without this, a failed Job is never reaped and holds the fleet's
      # "k8s job -- CronJob/Job run failed" monitor in Alert indefinitely,
      # long after the next scheduled run succeeds (found live via a
      # failed run stuck since a cluster-wide psycopg PoolTimeout blip).
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          annotations:
            ad.datadoghq.com/poller.logs: '[{"source":"python","service":"grug-poller"}]'
          labels:
            app: grug-poller
            tags.datadoghq.com/service: grug-poller
            tags.datadoghq.com/env: prod
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: registry-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: poller
              image: REGISTRY_PLACEHOLDER/grug-webhook:TAG_PLACEHOLDER
              # ddtrace-run (via datadog_switch, only when GRUG_DATADOG_ENABLED is on,
              # #1208) so poller spans are not silently dropped (review F4).
              command: ["python", "-m", "datadog_switch", "python", "-c", "from poller_handler import handler; handler({}, None)"]
              # envFrom is APP CONFIG ONLY: env credentials would out-rank
              # credential_process in the SDK chain and silently bypass the
              # Roles Anywhere path the boot proof asserts (#388/#389; the
              # static-key world is fully retired).
              envFrom:
                - secretRef: {name: grug-secrets}
              env:
                - {name: AWS_CONFIG_FILE, value: /etc/grug-aws/config}
                # Expected Roles Anywhere role (sed-pinned from SSM): the
                # identity proof ASSERTS the assumed identity matches this,
                # not merely that SOME credential worked (peer review 3x).
                - {name: GRUG_RA_ROLE_ARN, value: RA_ROLE_ARN_PLACEHOLDER}
                - {name: DD_SERVICE, value: grug-poller}
                - {name: DD_ENV, value: prod}
                - name: DD_VERSION
                  value: TAG_PLACEHOLDER
                - name: DD_AGENT_HOST
                  valueFrom: {fieldRef: {fieldPath: status.hostIP}}
                - {name: GRUG_ENV, value: prod}
                - {name: GITHUB_APP_ID_SSM, value: /grug/github-app-id}
                - {name: GITHUB_APP_PRIVATE_KEY_SSM, value: /grug/github-app-private-key}
                - {name: GITHUB_APP_WEBHOOK_SECRET_SSM, value: /grug/github-app-webhook-secret}
                - {name: GITHUB_APP_CLIENT_ID_SSM, value: /grug/github-app-client-id}
                - {name: GITHUB_APP_CLIENT_SECRET_SSM, value: /grug/github-app-client-secret}
                - {name: GRUG_CF_SHARED_SECRET_SSM, value: /grug/cf-shared-secret}
                - {name: GRUG_OPENROUTER_API_KEY_SSM, value: /infra/llm/openrouter_api_key}
                - {name: GRUG_POOLSIDE_API_KEY_SSM, value: /infra/llm/poolside_api_key}
                # Elder canary (personas/code_reviewer/canary.py): the hourly
                # review-quality check must run the SAME chain production
                # reviews use, so these mirror consumer-deployment.yaml.
                - {name: GRUG_REVIEW_BACKEND_PRIORITY, value: cloud}
                - {name: GRUG_OPENCODE_GO_API_KEY_SSM, value: /infra/llm/opencode_go_api_key}
                - {name: GRUG_OPENCODE_GO_FALLBACK_MODEL, value: "longcat-2.5-preview-free"}
                - {name: GRUG_CLOUD_FREE_TIER_MODEL, value: "nvidia/nemotron-3-super-120b-a12b:free"}
                # grug#1225: switched off 2026-10-17, the OpenCode Go allowance and
                # the OpenRouter credit are spent and not being refilled (36 Go 401s,
                # 11 OpenRouter paid refusals, 139 free per-day 429s over 402 Elder
                # runs). A listed backend is never called. Re-enable one by deleting
                # its entry; `openrouter:free` or `openrouter:paid` narrows to one pool.
                # grug#1269: OpenRouter's free pool is back on 2026-10-19 (the operator
                # wants the free tiers used up first); its paid pool stays off.
                - {name: GRUG_DISABLED_BACKENDS, value: "opencode-go,openrouter:paid"}
                # grug#1269: the gateway's free provider pool is a cloud tier after
                # Poolside, ahead of the Sparks (free cloud models first).
                - {name: GRUG_CLOUD_FREE_POOL, value: "true"}
                # grug#1286: post Elder's direct calls (OpenRouter, Poolside, OpenCode
                # Go) to the inference gateway's call ledger, beside the calls it routes.
                - {name: GRUG_CALL_REPORT, value: "true"}
                - {name: GRUG_SHARED_BENCHES, value: "true"}
                - {name: GRUG_OPENROUTER_REVIEW_MODEL, value: "nvidia/nemotron-3-super-120b-a12b:free"}
                - {name: GRUG_REVIEW_DEPTH, value: tiered}
                # grug#1553: GitHub App logins whose PRs carry an author family, as
                # `login:family` pairs split by `;` (e.g. `lane-app[bot]:claude`). Exact
                # login match only; family must be in model_family.py's table. Empty =
                # no App gets a family (Elder keeps its usual arm order for App PRs).
                - {name: GRUG_APP_AUTHOR_FAMILIES, value: ""}
                - {name: GRUG_PROMPT_EXPERIMENT_SSM, value: /grug/elder-prompt-experiment}
                - {name: GRUG_FALLBACK_ENABLED_SSM, value: /grug/elder-fallback-enabled}
                - {name: DD_SITE, value: datadoghq.com}
                - {name: DD_LLMOBS_ENABLED, value: "true"}
                - {name: DD_LLMOBS_ML_APP, value: grug-elder}
              resources:
                requests: {cpu: 50m, memory: 192Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                # Roles Anywhere tracer (#388, ADR-0008): the poller is the
                # FIRST workload on cert-derived short-lived creds. The SDK
                # reads AWS_CONFIG_FILE -> credential_process ->
                # aws_signing_helper (in the image) with the mounted leaf.
                - {name: grug-pki, mountPath: /var/run/grug-pki, readOnly: true}
                - {name: aws-config, mountPath: /etc/grug-aws, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
            - name: grug-pki
              secret:
                secretName: grug-pki-tls
            - name: aws-config
              configMap:
                name: grug-aws-config
