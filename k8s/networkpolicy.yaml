# Network segmentation for the grug namespace (audit #3).
#
# The OKE cluster is shared (grug runs as one of several tenant
# namespaces). Without a NetworkPolicy the namespace is flat /
# default-allow: any compromised pod anywhere on the cluster can reach the
# grug pods on any port, and a compromised grug pod has unrestricted
# egress. These policies close the lateral-movement path and add port-level
# egress hygiene.
#
# ENFORCEMENT NOTE: NetworkPolicy is only enforced by a policy-capable CNI.
# OKE's default VCN-native / flannel CNI does NOT enforce it unless Calico
# (or an equivalent) is installed. This manifest is harmless when
# unenforced and protective when enforced -- confirm the cluster CNI
# enforces NetworkPolicy for it to actually bite.
#
# Egress names its destination wherever the destination is an in-cluster
# workload a selector can match: cluster DNS (kube-dns), CNPG Postgres
# (the `databases` namespace), spark-gateway and the subscription lane.
# The rest stays port-scoped: AWS (SSM/SQS/KMS/S3), GitHub and the LLM
# backends on 443 are outside the cluster with no stable CIDR; the
# Kubernetes API server endpoint (6443) and the node-local Datadog agent
# (8125/8126) are host-network addresses no pod or namespace selector can
# match, and pinning an ipBlock would bake a cluster address into a public
# manifest. Port-scoping still blocks exfil over non-standard channels.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: grug
spec:
  # Empty podSelector = every pod in the namespace.
  podSelector: {}
  policyTypes: [Ingress]
  # No ingress rules => deny ALL inbound to every grug pod by default.
  # The allow-rule below re-opens only what must be reachable.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-ingress
  namespace: grug
spec:
  # Only the two HTTP services accept inbound; consumer + poller stay
  # fully sealed (they pull work from SQS / run on a cron, never serve).
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [grug-api, grug-webhook]}
  policyTypes: [Ingress]
  ingress:
    # Port 8080, from the Cloudflare tunnel connector only (#1634): the
    # `cloudflared` Deployment in the `cloudflared` namespace, pod label
    # app=cloudflared (read live). It is the only in-cluster caller of
    # either Service. Kubelet probes come from the node and are not pod
    # traffic, so they are unaffected. The request auth itself stays the
    # CF shared-secret + HMAC/session layers.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cloudflared}
          podSelector:
            matchLabels: {app: cloudflared}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scoped
  namespace: grug
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # DNS resolution: the kube-dns pods the ClusterFirst resolver's
    # Service DNATs to (an enforcer matches after the DNAT).
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # HTTPS: AWS APIs, GitHub, LLM backends.
    - ports:
        - {protocol: TCP, port: 443}
    # CNPG Postgres: the shared cluster in the `databases` namespace. No pod
    # selector, so a CNPG failover or a pooler in that namespace still
    # matches.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: databases}
      ports:
        - {protocol: TCP, port: 5432}
    # Kubernetes API server. The webhook and consumer (Smasher launcher SA)
    # and the preview janitor call `kubernetes.default.svc:443`, but an
    # enforcer matches the port AFTER the Service DNAT, and the API server
    # endpoint listens on 6443. Allowing only 443 would cut every API call
    # the moment the cluster starts enforcing this policy.
    - ports:
        - {protocol: TCP, port: 6443}
    # In-cluster spark-gateway (exposed-secret judge, #439 / ADR-0009).
    # Namespace-scoped (unlike the port-only rules above - this dest is
    # a single known namespace, so the CIDR-pinning follow-up is free).
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: spark-gateway}
          podSelector:
            matchLabels: {app: spark-gateway}  # the Service's own selector
      ports:
        - {protocol: TCP, port: 8080}
    # Elder's subscription lane (#1276, #1546): the in-cluster forwarder to the
    # operator's plans. Scoped the same way as the spark-gateway rule above.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: subscription-lane}
          podSelector:
            matchLabels: {app: forward}
      ports:
        - {protocol: TCP, port: 8080}
    # Node-local Datadog agent: DogStatsD (UDP 8125) + APM trace intake
    # (TCP 8126). Restricting these would silently kill observability.
    - ports:
        - {protocol: UDP, port: 8125}
        - {protocol: TCP, port: 8126}
# NOTE: Smasher Trial pods (#469) do NOT run in this namespace - they run in the
# dedicated `grug-trial` namespace with their own egress policy (see
# k8s/smasher-trial-namespace.yaml).
