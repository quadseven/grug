# grug-webhook on Kubernetes (#354). Image registry + tag are PLACEHOLDERS
# rewritten by the deploy workflow (sed from repository variables) - no
# registry host is committed to this public repo by design.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grug-webhook
  namespace: grug
  labels:
    app: grug-webhook
    tags.datadoghq.com/service: grug-webhook
    tags.datadoghq.com/env: prod
spec:
  # 2 replicas spread across zones: before this, every grug pod sat on ONE
  # home-LAN node - a single node (or home-internet) outage took the whole
  # product down, and the 2026-07-18 node-local DNS blip (digital-ledger#204,
  # grug#697) showed even a soft failure on that one node has total blast
  # radius. Webhook is stateless (Postgres-backed claim_delivery dedup; heavy
  # work enqueues to SQS), so replicas are safe.
  replicas: 2
  # RollingUpdate with maxUnavailable:0 so the dependency-aware /readyz (#404)
  # actually self-limits a bad deploy: the new pod must pass readiness before
  # the serving pod is removed, so a dep-broken rollout stalls on the last-good
  # pod instead of going to zero replicas (which Recreate would do).
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: grug-webhook}
  template:
    metadata:
      annotations:
        ad.datadoghq.com/webhook.logs: '[{"source":"python","service":"grug-webhook"}]'
      labels:
        app: grug-webhook
        tags.datadoghq.com/service: grug-webhook
        tags.datadoghq.com/env: prod
    spec:
      # The webhook runs the async Smasher Trial (#469), which LAUNCHES a
      # locked-down Job via the in-cluster k8s API - so it mounts the launcher
      # SA token. That token's PERMISSIONS are confined to the dedicated,
      # secret-free `grug-trial` namespace (jobs + pods + per-Job token secret;
      # k8s/smasher-trial-namespace.yaml + ADR-0013) and it has ZERO permissions
      # in this `grug` namespace - so a webhook compromise cannot use it to
      # reach grug-secrets. The token is mounted on every deploy (not gated by
      # the default-OFF feature flag), which is why its blast radius is bounded
      # by the grug-trial namespace isolation rather than by the flag.
      serviceAccountName: grug-smasher-launcher
      automountServiceAccountToken: true
      # Images are built natively for arm64 only - without this pin a
      # mixed-arch cluster schedules onto amd64 and exec-format-errors
      # (review F2).
      nodeSelector:
        kubernetes.io/arch: arm64
      # Spread the replicas across zones (lan / oci-iad / oci-ord node
      # labels) and nodes. Both SOFT (ScheduleAnyway / preferred): a strict
      # constraint would count a dead zone as an empty domain and block the
      # replacement pod during exactly the outage this exists to survive.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: grug-webhook}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: grug-webhook}
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webhook
          image: REGISTRY_PLACEHOLDER/grug-webhook:TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - secretRef: {name: grug-secrets}
            # Roles Anywhere ONLY (#389 retirement): the static key and its
            # reserve Secret no longer exist. Recovery from a broken cert
            # path = revert the retirement PR (restores the Pulumi user/key
            # + seed), redeploy, then flip this workload back to env creds
            # (RUNBOOK 'Rollback / recovery (post-retirement)').
          env:
            - {name: AWS_CONFIG_FILE, value: /etc/grug-aws/config}
            - {name: GRUG_RA_ROLE_ARN, value: RA_ROLE_ARN_PLACEHOLDER}
            - {name: DD_SERVICE, value: grug-webhook}
            - {name: DD_ENV, value: prod}
            - name: DD_VERSION
              value: TAG_PLACEHOLDER
            - name: DD_AGENT_HOST
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: DD_LOGS_INJECTION, value: "true"}
            - {name: GRUG_ENV, value: prod}
            # Off-Lambda async path (#368). Elder's production hot path is
            # durable SQS below; this flag still enables the local worker used
            # by the other async personas and by Elder only if that lane is
            # deliberately disabled.
            - {name: GRUG_K8S_RUNTIME, value: "1"}
            # Durable Elder hot path: stamp each webhook head onto the existing
            # rerun FIFO, then let the consumer require N seconds of head
            # stability before spending the deep-review budget. A moved head
            # is stale and cancelled; its newer webhook event owns the next
            # message. Lowered 180 -> 10 (2026-07-15, same day as the 90->180
            # raise): a real mid-flight staleness watcher now runs for the
            # whole duration of the Elder call (rerun.py's
            # _start_staleness_watch, ~_STALENESS_WATCH_INTERVAL_S=10s
            # polling), aborting a superseded review within seconds of the
            # new commit landing instead of letting it run to completion.
            # That watcher is the real protection now; this window only
            # needs to cover GitHub's normal read-after-write lag before the
            # very first check.
            - {name: GRUG_ELDER_DURABLE_QUEUE, value: "1"}
            # Base settle; Swift Hunt zeros tiny PRs and caps medium (Steady) at 3s.
            - {name: GRUG_ELDER_SETTLE_SECONDS, value: "5"}
            # Keep review configuration on both Elder-capable workloads. The
            # Opus override is review-only; judge, Teller, and /grug ask retain
            # their existing lower-cost OpenRouter model configuration.
            # Tiered Elder (#645): see consumer-deployment for full comments.
            - {name: GRUG_REVIEW_DEPTH, value: tiered}
            # Deep escalation (#645). WAS 500 lines / 0.05 sample, tuned for
            # speed. Measured 2026-08-12: grug's own PRs run 18-260 added
            # lines, so 5 of 6 never escalated and only ever saw the tier-1
            # coder arm - "Elder clear - no markings" meant "the weak arm
            # looked". Widened to 200/0.20 to buy coverage back. This costs
            # reasoner contention on the shared Spark; it is a dial, and
            # grug#853 makes the effect measurable rather than a matter of
            # opinion. Full comments in consumer-deployment.
            - {name: GRUG_DEEP_SAMPLE_RATE, value: "0.20"}
            - {name: GRUG_DEEP_DIFF_LINES, value: "200"}
            - {name: GRUG_DEEP_ASYNC, value: "1"}
            # Keep the compatibility worker's staging policy identical to the
            # durable consumer even though production uses the consumer path.
            - {name: GRUG_STAGED_REVIEW_BUDGET_S, value: "700"}
            - {name: GRUG_OPENROUTER_REVIEW_MODEL, value: anthropic/claude-opus-4.7}
            - {name: GITHUB_APP_ID_SSM, value: /grug/github-app-id}
            - {name: GITHUB_APP_PRIVATE_KEY_SSM, value: /grug/github-app-private-key}
            - {name: GITHUB_APP_WEBHOOK_SECRET_SSM, value: /grug/github-app-webhook-secret}
            - {name: GITHUB_APP_CLIENT_ID_SSM, value: /grug/github-app-client-id}
            - {name: GITHUB_APP_CLIENT_SECRET_SSM, value: /grug/github-app-client-secret}
            - {name: GRUG_CF_SHARED_SECRET_SSM, value: /grug/cf-shared-secret}
            - {name: GRUG_OPENROUTER_API_KEY_SSM, value: /infra/llm/openrouter_api_key}
            - {name: GRUG_POOLSIDE_API_KEY_SSM, value: /infra/llm/poolside_api_key}
            # grug#906/#910: try cloud before owned Sparks hardware. The operator,
            # 2026-08-27/28: "try opencode go first then openrouter free tier
            # 1000 limit then sparks last case." Reverses the 2026-07-14 call
            # this same file documents below (Cave primary, SaaS bounded
            # fallback) - deliberate, not a regression. Falls through to the
            # UNMODIFIED Cave path unconditionally on total cloud failure;
            # "cave" priority elsewhere (self-hosted deployments, tests)
            # is untouched by this flag existing.
            - {name: GRUG_REVIEW_BACKEND_PRIORITY, value: cloud}
            # opencode Go (deepseek-v4-flash): qualified live 2026-08-27,
            # small/medium diffs fast (1-9s) and deterministic; occasional
            # instability on large diffs (grug#910's own evidence) - bounded
            # by the chain's 25s timeout, safe because Cave is the guaranteed
            # fallback. GRUG_CLOUD_FREE_TIER_MODEL is deliberately UNSET: the
            # OpenRouter `:free` tier (grug#916) is off the review chain. A
            # tier-2 parse failure is returned as the answer and never falls
            # through, so a garbled free response blocked the Cave fallback
            # that works. Measured 2026-09-22: 212 free-tier parse failures in
            # a week (42 from a content-safety classifier), and a head-to-head
            # of six :free models on one real review returned zero usable
            # JSON (two 429s, one 8191-token runaway, three past 120s), while
            # the Sparks answered the same prompt in 13-25s. Setting the
            # variable again restores the tier with no code change.
            - {name: GRUG_OPENCODE_GO_API_KEY_SSM, value: /infra/llm/opencode_go_api_key}
            - {name: GRUG_PROMPT_EXPERIMENT_SSM, value: /grug/elder-prompt-experiment}
            # In-cluster spark-gateway for the evidence-scoped judge. Keep the
            # role assignment identical on both Elder-capable workloads.
            - {name: GRUG_CAVE_GATEWAY_URL, value: http://spark-gateway.spark-gateway.svc:8080}
            # infra#2451/#2454 precedent: the sparkicus vLLM resident is not a
            # fixed identity (infra#2452 swapped poolside/Laguna-S-2.1-NVFP4 ->
            # Qwen/Qwen3.8-27B-FP8 same-day). spark_gateway.py's `spark:warm-any`
            # sentinel routes to whichever vLLM target is reachable and rewrites
            # the outgoing model name to what it actually serves, so this stops
            # needing a lockstep edit on every future sparkicus swap - the same
            # fix already applied to macchina-cave-connector/the judge (#2450)
            # and hermes-discord (#2454). The review lane was pinned to a
            # Qwen coder tag on Sparkles; both Sparks now serve ONE
            # tensor-parallel DeepSeek and no Ollama, and an exact tag is a
            # strict membership test in the router, so all three lanes ask
            # for whatever is resident (2026-09-02).
            - {name: GRUG_CAVE_JUDGE_MODEL, value: "spark:warm-any"}
            - {name: GRUG_CAVE_REVIEW_MODEL, value: "spark:warm-any"}
            - {name: GRUG_CAVE_REASONER_MODEL, value: "spark:warm-any"}
            # Omen production-signal fusion (#470). All three fail-open:
            # absent params/mapping = zero DD calls = today's review.
            - {name: GRUG_DD_API_KEY_SSM, value: /grug/dd-api-key}
            - {name: GRUG_DD_APP_KEY_SSM, value: /grug/dd-app-key}
            - {name: GRUG_OMEN_SERVICE_MAP_SSM, value: /grug/omen-service-map}
            - {name: GRUG_FALLBACK_ENABLED_SSM, value: /grug/elder-fallback-enabled}
            # SAST detection engine (#401, engine swapped #858): Opengrep - the
            # LGPL-2.1 community fork of Semgrep CE - over the vendored offline
            # rules. Default off (builtin) elsewhere; on for the review workloads
            # (webhook + consumer). The opengrep binary ships in the image.
            # NOTE: this engine covers 10 hand-written PYTHON rules only. It is
            # not general security coverage - see #859 before trusting it.
            - {name: GRUG_SAST_ENGINE, value: opengrep}
            # Stable, writable, per-pod cache path for the engine
            # (#865). Unset falls back to the scan dir: correct but
            # re-extracts ~242M every scan.
            - {name: GRUG_SAST_CACHE_DIR, value: /var/cache/grug-sast}
            # Lint evidence (#681, epic #707): ruff over changed Python files,
            # selecting flake8-bandit/bugbear/async (S/B/ASYNC) for the recall
            # gap #707 measured. Default off elsewhere; on for the review
            # workloads, same shape as GRUG_SAST_ENGINE above. The ruff CLI
            # ships in the image (services/webhook/requirements.txt).
            - {name: GRUG_LINT_EVIDENCE, value: ruff}
            # Smasher Trial (#469): global master kill switch (default OFF - the
            # SSM param is absent/false until the operator opts in) + the image
            # the sandbox Job runs (the SAME webhook image, so personas.smasher
            # is importable inside the Job). The registry placeholder is pinned
            # by the deploy workflow, same as the container image above.
            - {name: GRUG_SMASHER_ENABLED_SSM, value: /grug/smasher-enabled}
            # Fail-closed egress gate: Smasher refuses to run author code unless
            # the operator affirms a policy-enforcing CNI here (default off).
            - {name: GRUG_SMASHER_NETPOL_ENFORCED_SSM, value: /grug/smasher-network-policy-enforced}
            - {name: GRUG_SMASHER_JOB_IMAGE, value: REGISTRY_PLACEHOLDER/grug-webhook:TAG_PLACEHOLDER}
            - {name: DD_SITE, value: datadoghq.com}
            - {name: DD_LLMOBS_ENABLED, value: "true"}
            - {name: DD_LLMOBS_ML_APP, value: grug-elder}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            # /readyz now does a (TTL-cached) SSM/KMS + Postgres probe (#404);
            # give the cache-miss request headroom over the 1s default and let
            # a transient blip flap a few times before marking not-ready.
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            # Measured over 7 days from the cluster's own per-pod metrics: working
            # set p95 450Mi, peak 511Mi against the old 512Mi limit, and the pod
            # before the current ones was last terminated as OOMKilled. The old
            # 192Mi request under-counted this pod by more than half, so the
            # scheduler packed nodes as if it were small. Request follows the
            # p95; the limit is 1.5x the observed peak. CPU is unchanged.
            requests: {cpu: 50m, memory: 448Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            # Roles Anywhere credential path (#389 - the #388 tracer wiring).
            - {name: grug-pki, mountPath: /var/run/grug-pki, readOnly: true}
            - {name: aws-config, mountPath: /etc/grug-aws, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            # Opengrep's runtime cache (#865). Its own volume so the
            # 242M extraction happens once per POD, outside both the
            # scanned tree and tmp's 64Mi cap.
            - {name: sast-cache, mountPath: /var/cache/grug-sast}
      volumes:
        - name: grug-pki
          secret:
            secretName: grug-pki-tls
        - name: aws-config
          configMap:
            name: grug-aws-config
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        # 1Gi against >=52.9 GB allocatable on the smallest node grug
        # can schedule on - capacity is not the constraint; opengrep
        # extracts ~242M and needs headroom to rewrite it on upgrade.
        - name: sast-cache
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: grug-webhook
  namespace: grug
  labels: {app: grug-webhook}
spec:
  selector: {app: grug-webhook}
  ports:
    - {name: http, port: 8080, targetPort: http}
